services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ela_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-ela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ela} -d ${POSTGRES_DB:-ela_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    image: ela-chatbot-api:local
    build:
      context: ./apps/api
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ela}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-ela_chatbot}
      STORAGE_PATH: /app/data/uploads
      MODEL_CACHE_PATH: /app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploaded_files:/app/data/uploads
      - huggingface_cache:/app/.cache/huggingface
    ports:
      - "${API_PORT:-7127}:8000"

  frontend:
    image: ela-chatbot-frontend:local
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      # 비워두면 브라우저가 접속한 호스트에 BACKEND_PORT를 붙여 API 주소를 만든다.
      # 별도 도메인으로 API를 노출할 때만 NEXT_PUBLIC_BACKEND_URL을 지정한다.
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
      NEXT_PUBLIC_BACKEND_PORT: ${API_PORT:-7127}
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-7128}:3000"

volumes:
  postgres_data:
  uploaded_files:
  huggingface_cache:
