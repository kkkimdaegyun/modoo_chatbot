[project]
name = "ela-chatbot-api"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL, pgvector, or external services",
  "model: downloads and runs local BGE models"
]

[tool.ruff]
line-length = 110
target-version = "py311"
