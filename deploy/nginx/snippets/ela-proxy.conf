# 모든 프록시 location 이 공통으로 쓰는 헤더. 고객사를 늘릴 때 빠뜨리기 쉬워 따로 뺐다.
#
# 설치
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp ela-proxy.conf /etc/nginx/snippets/

proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# API 의 분당 60건 제한이 이 헤더의 첫 IP 로 사람을 구분한다.
# 빠뜨리면 고객사 전체가 nginx IP 하나로 묶여 다 같이 429 를 맞는다.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# 프론트엔드가 og:image 등 절대 주소를 만들 때 https 를 쓰게 한다.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# 스트리밍 응답에서 Connection: close 가 붙지 않게 비워 둔다.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "";

proxy_connect_timeout 15s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
