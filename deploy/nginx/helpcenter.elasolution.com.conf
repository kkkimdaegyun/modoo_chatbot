# helpcenter.elasolution.com — 한 도메인 아래에 고객사를 서브패스로 나눠 담는다.
#
#   https://helpcenter.elasolution.com/leehk        고객이 쓰는 채팅
#   https://helpcenter.elasolution.com/leehk/admin  관리자 (링크는 어디에도 없고 주소로만 들어간다)
#   https://helpcenter.elasolution.com/kbs          두 번째 고객사
#
# 서브도메인이 아니라 서브패스를 쓰는 이유: 인증서 하나(helpcenter.elasolution.com)로
# 고객사를 계속 늘릴 수 있다. 서브도메인으로 가면 고객사마다 인증서를 더 받아야 한다.
#
# 설치
#   sudo cp helpcenter.elasolution.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/helpcenter.elasolution.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 각 고객사 폴더의 .env 에서 아래 두 값을 맞춰야 한다.
#   BASE_PATH=/leehk                 (프론트엔드 basePath. 바꾸면 이미지 재빌드 필요)
#   NEXT_PUBLIC_BACKEND_URL=/leehk   (브라우저가 API 를 같은 도메인 경로로 호출한다)
#   BIND_HOST=127.0.0.1              (7128/7127 을 인터넷에 직접 열지 않는다)

# 포트별 upstream 을 이름으로 두면 고객사를 추가할 때 아래 location 두 개만 복사하면 된다.
upstream ela_leehk_web { server 127.0.0.1:7128; }
upstream ela_leehk_api { server 127.0.0.1:7127; }
upstream ela_kbs_web   { server 127.0.0.1:7228; }
upstream ela_kbs_api   { server 127.0.0.1:7227; }

# HTTP 로 들어온 요청은 인증서 갱신 경로만 남기고 전부 HTTPS 로 보낸다.
server {
    listen 80;
    listen [::]:80;
    server_name helpcenter.elasolution.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.25.1 미만(우분투 20.04 의 1.18 포함)에는 별도 "http2 on;" 지시어가 없다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name helpcenter.elasolution.com;

    # GoGetSSL 등 상용 인증서를 쓸 때는 서버 인증서 + 중간 인증서를 한 파일로 이어 붙인 것을 지정한다.
    # 순서가 (내 인증서 → 중간 → 루트) 여야 하고, 순서가 틀리면 일부 안드로이드에서만 실패한다.
    ssl_certificate     /etc/nginx/ssl/helpcenter.elasolution.com.fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/helpcenter.elasolution.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    # 위젯을 고객사 웹사이트에서 iframe 으로 띄우므로 X-Frame-Options DENY 를 걸면 안 된다.
    # 특정 도메인만 허용하려면 frame-ancestors 에 나열한다.
    add_header Content-Security-Policy "frame-ancestors *" always;

    # 문서 업로드가 50MB 까지라 기본값(1m)이면 413 으로 막힌다.
    client_max_body_size 60m;

    # 뿌리로 들어오면 어디로 가야 하는지 알 수 없다. 안내 대신 첫 고객사로 보낸다.
    # 여러 고객사를 운영하면 여기에 안내 페이지를 두는 편이 낫다.
    location = / { return 302 /leehk/; }

    # ── 고객사 1: leehk ────────────────────────────────────────────────
    #
    # 실제 Next.js(next start)는 basePath 를 정적 에셋(/leehk/_next/static/...)에도
    # 서버가 스스로 반영하므로, 앞자리를 떼어 넘기는 별도 location 이 필요 없다.
    # 아래 /leehk 블록 하나가 페이지·API 아닌 모든 요청(정적 에셋 포함)을 그대로 넘긴다.
    #
    # API 를 먼저 선언해야 한다. /leehk/api/ 가 /leehk/ 보다 구체적이라 nginx 가 먼저 고르지만,
    # 사람이 읽을 때도 이 순서가 헷갈리지 않는다.
    location /leehk/api/ {
        # 뒤에 슬래시가 있으면 /leehk/api/chat → /api/chat 으로 앞자리를 떼고 넘긴다.
        proxy_pass http://ela_leehk_api/api/;
        include /etc/nginx/snippets/ela-proxy.conf;
        # 답변 스트리밍(SSE)은 버퍼링을 끄지 않으면 다 끝난 뒤에 한꺼번에 도착한다.
        proxy_buffering off;
        proxy_cache off;
    }

    # Swagger 와 헬스체크. 운영에서 굳이 열 필요가 없으면 이 블록을 지운다.
    location /leehk/docs      { proxy_pass http://ela_leehk_api/docs;      include /etc/nginx/snippets/ela-proxy.conf; }
    location /leehk/openapi.json { proxy_pass http://ela_leehk_api/openapi.json; include /etc/nginx/snippets/ela-proxy.conf; }
    location /leehk/health    { proxy_pass http://ela_leehk_api/health;    include /etc/nginx/snippets/ela-proxy.conf; }

    location /leehk {
        # 앞자리를 떼지 않고 그대로 넘긴다. 프론트엔드가 basePath=/leehk 로 빌드돼 있어
        # 스스로 /leehk/... 경로를 처리한다.
        proxy_pass http://ela_leehk_web;
        include /etc/nginx/snippets/ela-proxy.conf;
    }

    # ── 고객사 2: kbs ─────────────────────────────────────────────────
    location /kbs/api/ {
        proxy_pass http://ela_kbs_api/api/;
        include /etc/nginx/snippets/ela-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
    }
    location /kbs/docs        { proxy_pass http://ela_kbs_api/docs;        include /etc/nginx/snippets/ela-proxy.conf; }
    location /kbs/openapi.json { proxy_pass http://ela_kbs_api/openapi.json; include /etc/nginx/snippets/ela-proxy.conf; }
    location /kbs/health      { proxy_pass http://ela_kbs_api/health;      include /etc/nginx/snippets/ela-proxy.conf; }
    location /kbs {
        proxy_pass http://ela_kbs_web;
        include /etc/nginx/snippets/ela-proxy.conf;
    }
}
